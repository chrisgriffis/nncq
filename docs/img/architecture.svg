<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 440" width="1040" height="440" font-family="Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="nncq architecture: profile-linked workspace, change detection, CPU parse into SQLite (chunks, graph, UML model), optional GPU worker, the server feeding agents over MCP and the three-pane dashboard"><title>nncq architecture</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8490"/></marker></defs><rect width="1040" height="440" rx="12" fill="#0d0f13"/><rect x="10" y="10" width="1020" height="420" rx="10" fill="none" stroke="#4cc38a" stroke-opacity=".45" stroke-dasharray="6 5"/><text x="1014" y="32" text-anchor="end" fill="#4cc38a" font-size="12">this machine · 127.0.0.1 only · no network after init</text><rect x="30" y="50" width="180" height="66" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="30" y="58" width="3" height="50" rx="1.5" fill="#e5a50a"/><text x="120.0" y="79.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">workspace</text><text x="120.0" y="97.0" text-anchor="middle" fill="#7d8490" font-size="12">read-only · git / p4</text><rect x="260" y="50" width="200" height="66" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="260" y="58" width="3" height="50" rx="1.5" fill="#e5a50a"/><text x="360.0" y="79.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">find changes</text><text x="360.0" y="97.0" text-anchor="middle" fill="#7d8490" font-size="12">ripgrep + .gitignore · stat · SHA-1</text><rect x="510" y="50" width="200" height="66" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="510" y="58" width="3" height="50" rx="1.5" fill="#e5a50a"/><text x="610.0" y="79.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">T0 · CPU pool</text><text x="610.0" y="97.0" text-anchor="middle" fill="#7