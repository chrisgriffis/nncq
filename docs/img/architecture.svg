bols</text><rect x="282" y="242" width="58" height="22" rx="11" fill="#4cc38a" fill-opacity=".14" stroke="#4cc38a" stroke-opacity=".5"/><text x="311" y="257" text-anchor="middle" fill="#4cc38a" font-size="12">edges</text><rect x="348.0" y="242" width="80" height="22" rx="11" fill="#e5a50a" fill-opacity=".14" stroke="#e5a50a" stroke-opacity=".5"/><text x="388" y="257" text-anchor="middle" fill="#e5a50a" font-size="12">data xref</text><rect x="436" y="242" width="92" height="22" rx="11" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><text x="482" y="257" text-anchor="middle" fill="#a78bfa" font-size="12">UML model</text><rect x="536" y="242" width="156" height="22" rx="11" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".5"/><text x="614" y="257" text-anchor="middle" fill="#f472b6" font-size="12">views · compositions</text><path d="M610,116 L610,166" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><text x="660" y="146" text-anchor="middle" fill="#7d8490" font-size="11">chunks · graph</text><rect x="30" y="168" width="180" height="112" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="30" y="176" width="3" height="96" rx="1.5" fill="#4cc38a"/><text x="120.0" y="202.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">GPU worker</text><text x="120.0" y="220.0" text-anchor="middle" fill="#7d8490" font-size="12">T1 cards → T2 full</text><text x="120.0" y="238.0" text-anchor="middle" fill="#7d8490" font-size="12">own process</text><text x="120.0" y="256.0" text-anchor="middle" fill="#7d8490" font-size="12">pause = exit</text><path d="M210,205 L258,205" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><path d="M258,245 L212,245" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><text x="234" y="198" text-anchor="middle" fill="#7d8490" font-size="10">vectors</text><text x="234" y="262" text-anchor="middle" fill="#7d8490" font-size="10">text</text><rect x="760" y="130" width="250" height="160" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="760" y="138" width="3" height="144" rx="1.5" fill="#5aa9ff"/><text x="885.0" y="160.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">nncq server</text><text x="885.0" y="178.0" text-anchor="middle" fill="#7d8490" font-size="12">MCP · http or stdio</text><text x="885.0" y="195.0" text-anchor="middle" fill="#7d8490" font-size="12">ask · search: BM25 ∪ dense → rerank</text><text x="885.0" y="212.0" text-anchor="middle" fill="#7d8490" font-size="12">graph: calls, depends · by name</text><text x="885.0" y="229.0" text-anchor="middle" fill="#7d8490" font-size="12">uml: diagrams, compositions, staleness</text><text x="885.0" y="246.0" text-anchor="middle" fill="#7d8490" font-size="12">data: data files ↔ code types</text><text x="885.0" y="263.0" text-anchor="middle" fill="#7d8490" font-size="12">watcher → deltas</text><path d="M710,224 L758,224" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><text x="734" y="216" text-anchor="middle" fill="#7d8490" font-size="11">reads</text><rect x="760" y="330" width="120" height="66" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="760" y="338" width="3" height="50" rx="1.5" fill="#5aa9ff"/><text x="820.0" y="359.0" text-anchor="middle" fill="#d7dae0" font-size="13" font-weight="600">agents</text><text x="820.0" y="377.0" text-anchor="middle" fill="#7d8490" font-size="12">over MCP</text><rect x="890" y="330" width="120" height="66" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="890" y="338" width="3" height="50" rx="1.5" fill="#5aa9ff"/><text x="950.0" y="359.0" text-anchor="middle" fill="#d7dae0" font-size="13" font-weight="600">dashboard</text><text x="950.0" y="377.0" text-anchor="middle" fill="#7d8490" font-size="11">3 panes · same process</text><path d="M820,290 L820,328" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><path d="M950,290 L950,328" fill="none" stroke="#7d8490