<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 250" width="1040" height="250" font-family="Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="How a question is answered"><title>How a question is answered</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8490"/></marker></defs><rect width="1040" height="250" rx="12" fill="#0d0f13"/><rect x="20" y="95" width="130" height="60" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="20" y="103" width="3" height="44" rx="1.5" fill="#e5a50a"/><text x="85.0" y="121.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">question</text><text x="85.0" y="139.0" text-anchor="middle" fill="#7d8490" font-size="12">plain words</text><rect x="200" y="35" width="190" height="60" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="200" y="43" width="3" height="44" rx="1.5" fill="#e5a50a"/><text x="295.0" y="61.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">keyword · BM25</text><text x="295.0" y="79.0" text-anchor="middle" fill="#7d8490" font-size="12">top 100 · sub-words</text><rect x="200" y="155" width="190" height="60" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="200" y="163" width="3" height="44" rx="1.5" fill="#5aa9ff"/><text x="295.0" y="181.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">meaning · dense</text><text x="295.0" y="199.0" text-anchor="middle" fill="#7d8490" font-size="12">Nemotron embed · ~20 ms</text><rect x="440" y="95" width="130" height="60" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="440" y="103" width="3" height="44" rx="1.5" fill="#5aa9ff"/><text x="505.0" y="121.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">fuse</text><text x="505.0" y="139.0" text-anchor="middle" fill="#7d8490" font-size="12">reciprocal rank</text><rect x="620" y="95" width="160" height="60" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="620" y="103" width="3" height="44" rx="1.5" fill="#4cc38a"/><text x="700.0" y="121.0" text-anchor="middle" fill="#d7dae0" font-size="14" font-weight="600">rerank top 40</text><text x="700.0" y="139.0" text-anchor="middle" fill="#7d8490" font-size="12">cross-encoder · ~0.9 s</text><path d="M150,125 L175,125 L175,65 L198,65" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><path d="M175,125 L175,185 L198,185" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><path d="M390,65 L415,65 L415,125 L438,125" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><path d="M390,185 L415,185 L415,125" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><path d="M570,125 L618,125" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><path d="M780,125 L818,125" fill="none" stroke="#7d8490" stroke-width="1.5" marker-end="url(#a)"/><rect x="820" y="20" width="200" height="210" rx="8" fill="#151821" stroke="#2a2f3d"/><rect x="820" y="28" width="3" height="194" rx="1.5" fill="#4cc38a"/><text x="838" y="46" fill="#d7dae0" font-size="14" font-weight="600">ask → a map, not code</text><circle cx="842" cy="72" r="3" fill="#4cc38a"/><text x="852" y="76" fill="#7d8490" font-size="12">read as: words, stems, ignored</text><circle cx="842" cy="94" r="3" fill="#4cc38a"/><text x="852" y="98" fill="#7d8490" font-size="12">code says: its own words</text><circle cx="842" cy="116" r="3" fill="#4cc38a"/><text x="852" y="120" fill="#7d8490" font-size="12">found by: keyword / meaning</text><circle cx="842" cy="138" r="3" fill="#4cc38a"/><text x="852" y="142" fill="#7d8490" font-size="12">strength: strong · fair · weak</text><circle cx="842" cy="160" r="3" fill="#4cc38a"/><text x="852" y="164" fill="#7d8490" font-size="12">one line of facts per hit</text><circle cx="842" cy="182" r="3" fill="#4cc38a"/><text x="852" y="186" fill="#7d8490" font-size="12">links: A calls B, derives…</text><circle cx="842" cy="204" r="3" fill="#4cc38a"/><text x="852" y="208" fill="#7d8490" font-size="12">next: expand(refs) on demand</text></svg>
