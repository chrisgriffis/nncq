# nncq codebase profile. Copy this folder to profiles/<name>/ (or let `nncq init` / `nncq profile new` write it).
# profiles/* is git-ignored except this template: real profiles name private repos, paths and formats.
# One profile = one workspace = one index (cache/db/<name>/index.db).

name = "example"
description = "What this codebase is (shown to agents in the MCP instructions)"

[workspace]
# How this profile finds its workspace on the current machine. The workspace lives anywhere outside the nncq
# folder (never inside it). Candidates are tried in order; the first that passes the checks wins.
# NNCQ_WORKSPACE_<NAME> (in .env or the environment) overrides the list, e.g. NNCQ_WORKSPACE_EXAMPLE=D:/ws.
roots = ["~/src/example", "D:/example"]
markers = ["CMakeLists.txt"]        # paths that must exist under the root
git_remote = ""                     # optional: substring the git origin URL must contain
dirs = []                           # code folders under the root to index ([] = everything)
ignore = []                         # extra gitignore-style globs (case-insensitive), e.g. "**/Prebuild/**"
ignore_defaults = true              # also skip the built-in vendored / generated defaults (walk.py)
# ---- end of [workspace]

[index]
# Extra file extensions: ext -> language ("text" = line windows, or a tree-sitter language such as "cpp").
extensions = {}
# Non-code formats to index (default: markdown, cmake, make, dockerfile, proto, batch).
# text_langs = ["markdown", "cmake"]

# Brace-block definition languages (C-like IDL / schema / service definition files): chunked at declarations,
# symbols and `name : Base` inheritance extracted. Repeat the table for several languages.
# [[dsl]]
# lang = "idl"
# extensions = [".idl"]
# keywords = ["class", "struct", "enum", "interface", "service"]   # declaration keywords (default: a broad set)
# containers = ["class", "struct", "interface", "service"]          # kinds whose members get their own chunks
# module_keyword = "module"                                          # `module X;` qualifies what follows (X.Foo)

# Data cross-reference: data files (XML / JSON / YAML assets ...) that instantiate code types and reference
# each other. Answers: what data uses this code type, what code an asset uses, who references an asset, the
# most referenced assets. Regexes run with ripgrep (Rust syntax) and Python; keep them to the common subset.
# [[xref]]
# name = "assets"
# label = "asset"                                       # what a data file is called in answers
# glob = "*.asset.xml"
# instance = '<object [^>]*?type="(?P<type>[^"]+)"'     # each match: a type the file instantiates
# reference = 'ref="(?P<ref>[^"#]+)#'                    # each match: another file it references (no extension)
# type_suffix = "Data"                                  # data type FooData belongs to code class Foo

[mcp]
# Appended to the MCP server instructions for this workspace: vocabulary, where things live, conventions.
notes = ""
