# master -> image on GHCR -> the hosted read-only demo (Azure Container Apps).
# Repo variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC federated credential), ACA_APP, ACA_RG.
name: deploy demo
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: deploy-demo
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nncq-demo
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az containerapp update -n "${{ vars.ACA_APP }}" -g "${{ vars.ACA_RG }}" --image "${{ env.IMAGE }}:${{ github.sha }}" -o none
