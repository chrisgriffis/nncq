[project]
name = "nncq"
version = "0.1.0"
description = "No-net code query: fully local hybrid code search + symbol graph over MCP, using NVIDIA Nemotron embed/rerank."
requires-python = ">=3.11,<3.14"
# torch is installed by setup.ps1 from the CUDA wheel index (pip can't pick the CUDA build from here).
# Core = the lite profile: keyword search, symbol graph, .xdata cross-reference. No torch, no models, no GPU.
dependencies = [
  "numpy>=2.0",
  "mcp==1.30.0",
  "uvicorn>=0.30",
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=0.9",
  "watchdog>=6.0",
  "ripgrep==14.1.0",   # the last release with prebuilt Windows wheels; later ones need Rust + MSVC to build
]

[project.optional-dependencies]
# Full profile: embeddings + reranker. torch itself comes from init.ps1 (CUDA wheel index).
gpu = [
  "transformers==5.7.0",
  "sentence-transformers==5.4.1",
  "huggingface-hub>=1.0",
]
dev = ["pytest>=8"]

[project.scripts]
nncq = "nncq.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nncq*"]

[tool.pytest.ini_options]
testpaths = ["tst"]
